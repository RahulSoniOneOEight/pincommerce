adapter_id: marketplace-mercur
domain: marketplace
provider: mercur
capabilities:
  - seller-onboarding
  - seller-catalogue
  - seller-inventory
  - marketplace-orders
  - offers
  - commissions
  - settlements
  - seller-analytics
  - seller-approval
  - payout-reconciliation
commands:
  - marketplace.sync_seller
  - marketplace.sync_offer
  - marketplace.allocate_order
  - marketplace.record_fulfilment
  - marketplace.record_return
  - marketplace.create_settlement
events:
  - seller.created
  - seller.updated
  - offer.updated
  - marketplace.order_allocated
  - seller.fulfilment_updated
  - seller.return_received
  - seller.settlement_created
  - seller.settlement_paid
healthcheck: /health
reconciliation_flows:
  - commerce-order-to-seller-allocation
  - seller-settlement-to-accounting
  - seller-payout-reconciliation
