registry_id: pincommerce-ui-implementation-registry
version: 1
components:
  - semantic_id: commerce.product-card
    penpot:
      component: ProductCard
      variants: [mobile-compact, mobile-standard, web-grid, web-horizontal, b2b-dense]
    flutter:
      owned_component: PinProductCard
      primitive: shadcn_flutter
      libraries: [shadcn_flutter]
    web:
      owned_component: ProductCard
      primitive: shadcn/ui
      base: Base UI
      libraries: [shadcn/ui, Base UI]
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: commerce.button
    penpot: {component: Button, variants: [primary, secondary, destructive, ghost]}
    flutter: {owned_component: PinButton, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Button, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, Base UI]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: commerce.input
    penpot: {component: Input, variants: [default, error, disabled]}
    flutter: {owned_component: PinInput, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Input, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, Base UI]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: commerce.form
    penpot: {component: Form, variants: [stacked, dense]}
    flutter: {owned_component: PinForm, primitive: shadcn_flutter, libraries: [shadcn_flutter, flutter_form_builder]}
    web: {owned_component: Form, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, React Hook Form]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: commerce.search
    penpot: {component: Search, variants: [mobile-overlay, desktop-command]}
    flutter: {owned_component: PinSearch, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Search, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, Base UI]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: commerce.filters
    penpot: {component: Filters, variants: [chips, bottom-sheet, sidebar, popover]}
    flutter: {owned_component: PinFilters, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Filters, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, Base UI]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: data.table
    penpot: {component: DataTable, variants: [compact, operational, full]}
    flutter: {owned_component: PinDataTable, primitive: data_table_2, libraries: [data_table_2]}
    web: {owned_component: DataTable, primitive: TanStack Table, libraries: [TanStack Table]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: analytics.chart
    penpot: {component: Chart, variants: [line, bar, area, donut]}
    flutter: {owned_component: PinChart, primitive: fl_chart, libraries: [fl_chart]}
    web: {owned_component: Chart, primitive: Recharts, libraries: [Recharts]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: layout.carousel
    penpot: {component: Carousel, variants: [product, banner, gallery]}
    flutter: {owned_component: PinCarousel, primitive: PageView, libraries: [Flutter PageView, carousel_slider]}
    web: {owned_component: Carousel, primitive: Embla Carousel, libraries: [Embla Carousel]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: layout.standard-grid
    penpot: {component: ProductGrid, variants: [phone-2, tablet-3, desktop-4, wide-5]}
    flutter: {owned_component: PinResponsiveGrid, primitive: GridView, libraries: [Flutter GridView]}
    web: {owned_component: ResponsiveGrid, primitive: CSS Grid, libraries: [CSS Grid, Tailwind]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: layout.masonry
    penpot: {component: MasonryGrid, variants: [mobile, desktop]}
    flutter: {owned_component: PinMasonryGrid, primitive: flutter_staggered_grid_view, libraries: [flutter_staggered_grid_view]}
    web: {owned_component: MasonryGrid, primitive: CSS masonry, libraries: [CSS Grid, Tailwind]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: feedback.toast
    penpot: {component: Toast, variants: [success, error, warning, info]}
    flutter: {owned_component: PinToast, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Toast, primitive: Sonner, libraries: [Sonner, shadcn/ui]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: navigation.tabs
    penpot: {component: Tabs, variants: [mobile-segmented, desktop-tabs]}
    flutter: {owned_component: PinTabs, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Tabs, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, Base UI]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: overlay.dialog
    penpot: {component: Dialog, variants: [modal, sheet]}
    flutter: {owned_component: PinDialog, primitive: shadcn_flutter, libraries: [shadcn_flutter]}
    web: {owned_component: Dialog, primitive: shadcn/ui, base: Base UI, libraries: [shadcn/ui, Base UI]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
  - semantic_id: input.date-time
    penpot: {component: DateTime, variants: [mobile-picker, desktop-calendar]}
    flutter: {owned_component: PinDateTime, primitive: Flutter date component, libraries: [Flutter]}
    web: {owned_component: DateTime, primitive: shadcn Calendar, libraries: [shadcn/ui]}
    qa: {flutter: widgetbook+golden, web: storybook+visual}
specialists:
  icons: {primary: Phosphor, secondary: Iconoir, fallback: Hugeicons}
  motion: {flutter: flutter_animate, web: Motion, rich: [Rive, Lottie]}
  layout: {flutter: [GridView, flutter_staggered_grid_view], web: [CSS Grid, Tailwind]}
  carousel: {flutter: [PageView, carousel_slider], web: [Embla Carousel]}
  tables: {flutter: data_table_2, web: TanStack Table}
  charts: {flutter: fl_chart, web: Recharts}
  accessibility: {flutter: Flutter semantics, web: [Base UI, React Aria, semantic HTML]}
status: review-ready
