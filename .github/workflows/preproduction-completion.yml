name: Preproduction Points 1-40 Completion
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest tests.test_preproduction_completion -v
      - run: python -m tooling.validation.preproduction --client reference-retail
      - run: python -m tooling.validation.preproduction --client reference-retail --check-drift
