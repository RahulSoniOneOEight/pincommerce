name: Phase 1 Steps 1-45 Acceptance
on:
  pull_request:
    paths:
      - 'tooling/**'
      - 'contracts/**'
      - 'workflows/**'
      - 'apps/review_mode/**'
      - 'tests/test_phase1_45.py'
      - 'tests/test_phase1_intelligence_review_v2.py'
      - '.github/workflows/phase1-steps-1-45.yml'
  push:
    branches: [main]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest tests.test_phase1_45 tests.test_phase1_intelligence_review_v2 -v
      - run: python tooling/validation/validate_all.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies and refresh stale lock metadata locally
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run review:build
