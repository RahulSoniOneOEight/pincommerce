name: Design Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run sync:dry -- --out artifacts/penpot-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: penpot-plan
          path: artifacts/penpot-plan.json
          if-no-files-found: ignore
