name: Design Sources Dependency Learning Acceptance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  stage2-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Test Stage 2 design intelligence
        run: python -m unittest tests.test_design_learning_stage2 -v
      - name: Verify policy guardrails
        run: |
          python - <<'PY'
          import yaml
          p=yaml.safe_load(open("design-intelligence/stage2-policy.yaml"))
          g=p["learning"]["guardrails"]
          assert g["advisory_only"] is True
          assert g["requires_human_approval"] is True
          assert g["auto_promote"] is False
          assert g["mutate_approved_client_design"] is False
          print("Stage 2 guardrails verified")
          PY
