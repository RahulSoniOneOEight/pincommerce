version: 1
stage: rendered-visual-evidence
story_ids:
  product-card: commerce-productcard--default
  category-rail: commerce-categoryrail--default
  b2b-quick-order: commerce-b2bquickorder--default
  dashboard-kpi: commerce-dashboardkpi--default
  exception-table: commerce-exceptiontable--default
  filter-bar: commerce-filterbar--default
  checkout-summary: commerce-checkoutsummary--default
  navigation-menu: commerce-navigationmenu--default
  form-section: commerce-formsection--default
viewports:
  mobile-390: {width: 390, height: 844}
  tablet-768: {width: 768, height: 1024}
  desktop-1440: {width: 1440, height: 1000}
accessibility:
  max_critical: 0
  max_serious: 0
performance:
  max_dom_content_loaded_ms: 2500
  max_transfer_bytes: 4000000
  max_component_runtime_ms: 2000
visual:
  require_screenshot_artifact: true
  deterministic_fingerprint_gate: true
  pixel_baseline_mode: external-binary-baseline
  note: binary PNG baselines are approved separately; CI always emits rendered screenshots
tournament:
  weights:
    accessibility: 30
    performance: 25
    visual-regression: 25
    completeness: 20
  minimum_score: 80
