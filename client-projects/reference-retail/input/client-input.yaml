client_id: reference-retail
industry: retail
business_models: [d2c, b2b]
goals:
  - mobile-and-web-commerce
  - integrated-inventory
  - governed-returns
source_refs:
  - brief:reference-retail
experience_requirements:
  - requirement_id: REQ-REF-001
    statement: Customer should see available credit and approval status during checkout
    ux_impact: true
    source_refs: [brief:reference-retail]
    requested_surfaces: [customer-app, web-store]
    requested_screens: [checkout, approval-status]
    requested_components: [credit-limit-card, approval-banner]
    required_states: [available, limit-exceeded, approval-pending, approved]
  - requirement_id: REQ-REF-002
    statement: Commerce admin should review orders, inventory, promotions and returns
    ux_impact: true
    source_refs: [brief:reference-retail]
    requested_surfaces: [commerce-admin]
    requested_screens: [orders, inventory, promotions, returns]
    requested_components: [data-table, filter-bar, status-chip, bulk-actions]
    required_states: [default, loading, empty, failure]
  - requirement_id: REQ-REF-003
    statement: Operations team needs visibility into failed payment and shipment exceptions
    ux_impact: true
    source_refs: [brief:reference-retail]
    requested_surfaces: [analytics]
    requested_screens: [operations-overview, exceptions]
    requested_components: [metric-card, exception-table, status-chip]
    required_states: [default, open, resolved, failed]
core_module_requirements: []
required_integrations: [payment, logistics, whatsapp]
constraints:
  - provider-neutral-contracts
